title: AWS Admin Access Granted to a User or Group
status: test
description: Detects when an AWS IAM user is granted AdministratorAccess policy or is added to an admin group.
author: surya.tyagi@accuknox.com
date: 2025/08/14
logsource:
  product: cloudtrail
detection:
  selection_policy_attach:
    eventName: AttachUserPolicy
    requestParameters.policyArn: "arn:aws:iam::aws:policy/AdministratorAccess"
  selection_group_add:
    eventName: AddUserToGroup
    requestParameters.groupName|re: '(?i)admin'
  condition: selection_policy_attach or selection_group_add
falsepositives:
  - Intentional granting of admin rights
level: high