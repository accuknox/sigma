title: AWS Security Group Allows Inbound SSH or RDP from Anywhere
id: b2e3a6f0-9e12-4a77-b68f-aws-sg-ssh-rdp
status: test
description: Detects AWS Security Groups allowing inbound SSH (22) or RDP (3389) access from any source.
author: suryatyagi@accuknox.com
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: AuthorizeSecurityGroupIngress
    requestParameters.ipPermissions.items:
      - fromPort: 22
        toPort: 22
      - fromPort: 3389
        toPort: 3389
  condition: selection
falsepositives:
  - Intended exposure for public services
level: high
