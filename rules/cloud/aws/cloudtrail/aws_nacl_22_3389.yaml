title: AWS NACL Entry Creation Allowing Port 22 or 3389
id: f5a3bb92-1c26-4e87-8a0d-42af1128ad57
description: Detect creation of a Network ACL entry that allows SSH (22) or RDP (3389), standalone or as part of a range, in AWS.
author: suryatyagi@accuknox.com
status: test
date: 2025/08/14
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_event:
    eventSource: "ec2.amazonaws.com"
    eventName: "CreateNetworkAclEntry"
    requestParameters.ruleAction: "allow"
    eventName": "AuthorizeSecurityGroupIngress"
  selection_ports:
    - requestParameters.portRange.from: 22
    - requestParameters.portRange.to: 22
    - requestParameters.portRange.from: 3389
    - requestParameters.portRange.to: 3389
  condition: selection_event AND selection_ports
level: high

